# A CI configuration to publish packages to pub.dev.

name: Publish
permissions:
  contents: read

on:
  push:
    # Match <package-name>-v<version> publish tags, excluding artifacts-v* tags.
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+*'
      - '!artifacts-v*'

jobs:
  check-artifacts:
    name: Verify Prebuilt Native Artifact Hashes
    if: ${{ github.repository_owner == 'google' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Enforce Strict Artifact Freshness
        run: dart tool/check_artifact_hashes.dart --strict

  publish:
    needs: check-artifacts
    if: ${{ github.repository_owner == 'google' }}
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@40657d0d0732d6fd3809f5841380e7519e355b50 # main
    with:
      working-directory: pkgs/{package}
      use-flutter: false
