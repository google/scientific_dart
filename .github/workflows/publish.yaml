# A CI configuration to auto-publish pub packages.

name: Publish
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    # Match <package-name>-v<version> publish tags, excluding artifacts-v* tags.
    tags:
      - '[A-z0-9]+-v[0-9]+.[0-9]+.[0-9]+*'
      - '!artifacts-v*'

jobs:
  check-artifacts:
    name: Verify Prebuilt Native Artifact Hashes
    if: ${{ github.repository_owner == 'google' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Enforce Strict Artifact Freshness
        run: dart tool/check_artifact_hashes.dart --strict

  publish:
    needs: check-artifacts
    if: ${{ always() && github.repository_owner == 'google' && (needs.check-artifacts.result == 'success' || needs.check-artifacts.result == 'skipped') }}
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@44a076899c67023a21a1b115cae8b7dcc0d79631
    with:
      write-comments: false
    permissions:
      id-token: write
      pull-requests: write
