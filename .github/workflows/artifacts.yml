name: Native Artifacts & Provenance

on:
  push:
    tags:
      - 'artifacts-v*'
  pull_request:
    paths:
      - 'pkgs/pocketfft/hook/**'
      - 'pkgs/pocketfft/lib/src/hook_helpers/**'
      - 'pkgs/openblas/hook/**'
      - 'pkgs/openblas/lib/src/hook_helpers/**'
      - 'pkgs/ndarray/hook/**'
      - 'pkgs/ndarray/lib/src/hook_helpers/**'
      - 'tool/build_artifacts.dart'
      - 'tool/check_native_symbols.dart'
      - 'tool/regenerate_hashes.dart'
      - '.github/workflows/artifacts.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag to publish artifacts under (e.g. artifacts-v0.0.2)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-native-artifacts:
    name: Build (${{ matrix.target_label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target_os: linux
            target_arch: x64
            ios_sdk: ''
            target_label: linux-x64
          - runner: ubuntu-24.04-arm
            target_os: linux
            target_arch: arm64
            ios_sdk: ''
            target_label: linux-arm64
          - runner: macos-latest
            target_os: macos
            target_arch: arm64
            ios_sdk: ''
            target_label: macos-arm64
          - runner: macos-latest
            target_os: macos
            target_arch: x64
            ios_sdk: ''
            target_label: macos-x64
          - runner: windows-latest
            target_os: windows
            target_arch: x64
            ios_sdk: ''
            target_label: windows-x64
          - runner: ubuntu-latest
            target_os: android
            target_arch: arm64
            ios_sdk: ''
            target_label: android-arm64
          - runner: ubuntu-latest
            target_os: android
            target_arch: x64
            ios_sdk: ''
            target_label: android-x64
          - runner: macos-latest
            target_os: ios
            target_arch: arm64
            ios_sdk: iphoneos
            target_label: ios-iphoneos-arm64
          - runner: macos-latest
            target_os: ios
            target_arch: arm64
            ios_sdk: iphonesimulator
            target_label: ios-iphonesimulator-arm64
          - runner: macos-latest
            target_os: ios
            target_arch: x64
            ios_sdk: iphonesimulator
            target_label: ios-iphonesimulator-x64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: stable

      - name: Install Linux Build Dependencies
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran build-essential cmake

      - name: Verify Android NDK & Build Dependencies
        if: matrix.target_os == 'android'
        run: |
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          cmake --version
          readelf --version

      - name: Set up MSVC Developer Command Prompt
        if: matrix.target_os == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Dependencies
        run: dart pub get

      - name: Cache Native Build Intermediates
        if: github.event_name == 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .dart_tool/artifact_builder/
          key: artifact-builder-${{ matrix.target_label }}-${{ hashFiles('pkgs/*/hook/**') }}
          restore-keys: |
            artifact-builder-${{ matrix.target_label }}-

      - name: Build Native Artifacts
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          IOS_SDK: ${{ matrix.ios_sdk }}
        run: |
          ARGS=(--os "$TARGET_OS" --architecture "$TARGET_ARCH" --output-dir dist)
          if [ -n "$IOS_SDK" ]; then
            ARGS+=(--ios-sdk "$IOS_SDK")
          fi
          dart tool/build_artifacts.dart "${ARGS[@]}"

      - name: Verify Exported Native Symbols, Binary Hygiene, & Embedded Source Hash
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          IOS_SDK: ${{ matrix.ios_sdk }}
        run: |
          ARGS=(--os "$TARGET_OS" --architecture "$TARGET_ARCH" --artifact-dir dist)
          if [ -n "$IOS_SDK" ]; then
            ARGS+=(--ios-sdk "$IOS_SDK")
          fi
          dart tool/check_native_symbols.dart "${ARGS[@]}"

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-libs-${{ matrix.target_label }}
          path: dist/*
          if-no-files-found: error

  attest-and-release:
    name: Attest SLSA Provenance & Release
    needs: build-native-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download All Built Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-libs-*
          path: dist
          merge-multiple: true

      - name: Generate Unified SHA256SUMS.txt
        working-directory: dist
        run: |
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate SLSA v1.0 Build Provenance Attestation
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/*'

      - name: Copy Attestation Bundle into dist
        if: steps.attest.outputs.bundle-path != ''
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" dist/provenance.intoto.jsonl

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: stable

      - name: Smoke Test `regenerate_hashes.dart` & `local` Build Mode
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          dart pub get
          dart tool/regenerate_hashes.dart "$RELEASE_TAG" --local-dir dist --skip-provenance
          dart tool/check_artifact_hashes.dart --strict
          (cd pkgs/pocketfft && POCKETFFT_BUILD_MODE=local LOCAL_POCKETFFT_BINARY="$PWD/../../dist" dart test)

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Prebuilt native binary artifacts for `scientific_dart` (`pocketfft`, `openblas`, `ndarray`) at `${{ inputs.tag || github.ref_name }}`.

            ### SLSA Build Provenance Verification
            All binary artifacts in this release are cryptographically attested with SLSA v1.0 build provenance via GitHub Artifact Attestations (Sigstore/Fulcio).

            Verify any artifact using the GitHub CLI:
            ```bash
            gh attestation verify <artifact-file> --repo ${{ github.repository }}
            ```

            To update the pinned SHA-256 hashes in the repository after verifying provenance:
            ```bash
            dart tool/regenerate_hashes.dart ${{ inputs.tag || github.ref_name }}
            ```
