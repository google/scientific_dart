name: Benchmarks (Dart AOT vs NumPy/SciPy)

on:
  workflow_dispatch:
    inputs:
      samples:
        description: 'Measurement samples per benchmark'
        required: false
        default: '21'
        type: string
      threads:
        description: 'Thread count for multi-threaded matmul rows'
        required: false
        default: '4'
        type: string

permissions:
  contents: read

jobs:
  benchmark-linux-x64:
    name: Benchmark (ubuntu-latest, Dart AOT vs PyPI NumPy/SciPy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Cache Native Build Artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .dart_tool/
            pkgs/ndarray/.dart_tool/
            pkgs/openblas/.dart_tool/
            pkgs/pocketfft/.dart_tool/
          key: ${{ runner.os }}-bench-build-${{ hashFiles('pubspec.yaml', 'pkgs/**/pubspec.yaml', 'pkgs/**/build.dart', 'pkgs/**/*.c', 'pkgs/**/*.cpp', 'pkgs/**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-bench-build-

      - name: Install PyPI NumPy & SciPy (OpenBLAS wheels)
        run: |
          python -m venv .venv-bench
          .venv-bench/bin/pip install --upgrade pip
          .venv-bench/bin/pip install numpy scipy
          .venv-bench/bin/python -c "import numpy as np, scipy; print('NumPy', np.__version__, 'SciPy', scipy.__version__); np.show_config()"

      - name: Install Dart Workspace Dependencies
        run: dart pub get

      - name: Run Curated AOT vs NumPy/SciPy Benchmarks
        working-directory: pkgs/ndarray
        env:
          BENCH_SAMPLES: ${{ inputs.samples || '21' }}
          BENCH_THREADS: ${{ inputs.threads || '4' }}
        run: |
          dart run benchmark/run_readme_benchmark.dart \
            --python "$GITHUB_WORKSPACE/.venv-bench/bin/python" \
            --samples "$BENCH_SAMPLES" \
            --threads "$BENCH_THREADS" \
            --strict-blas \
            --markdown benchmark/report/readme_comparison.md \
            --json benchmark/report/readme_comparison.json

      - name: Publish Report to Job Summary
        run: cat pkgs/ndarray/benchmark/report/readme_comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Benchmark Report Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ndarray-benchmarks-linux-x64
          path: |
            pkgs/ndarray/benchmark/report/readme_comparison.md
            pkgs/ndarray/benchmark/report/readme_comparison.json
