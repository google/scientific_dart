name: ndarray
description: NumPy-inspired N-dimensional arrays, matrices, and tensors for Dart with SIMD acceleration, OpenBLAS/LAPACK linear algebra, FFT signal processing, and native FFI.
version: 0.4.0-wip
resolution: workspace
homepage: https://google.github.io/scientific_dart/
repository: https://github.com/google/scientific_dart/tree/main/pkgs/ndarray
issue_tracker: https://github.com/google/scientific_dart/issues
topics:
  - math
  - matrix
  - tensor
  - linear-algebra
  - signal-processing

environment:
  sdk: ^3.10.0

platforms:
  linux:
  macos:
  windows:

# Add regular dependencies here.
dependencies:
  openblas: ^0.1.0
  ffi: ^2.2.0
  pocketfft: ^0.2.0
  hooks: '>=1.0.3 <3.0.0'
  code_assets: '>=1.0.0 <3.0.0'
  crypto: ^3.0.7
  meta: ^1.18.2
  resource_scope: ^0.1.1

dev_dependencies:
  analyzer: ^13.0.0
  archive: ^3.6.1
  lints: ^6.1.0
  test: ^1.31.1
  coverage: ^1.15.0
  ffigen: ^20.1.1
  criterion:
    git: https://github.com/sigurdm/criterion.git
