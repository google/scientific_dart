name: NDArrayNativeBindings
description: Automatically generated type-safe Dart FFI bindings for package:ndarray custom C extensions.
output: lib/src/ndarray_bindings.dart
ffi-native:
  asset-id: 'package:ndarray/ndarray'
headers:
  entry-points:
    - hook/custom_sorting.h
    - hook/custom_ufuncs.h
preamble: |
  // Automatically generated by ffigen. DO NOT EDIT.
  // ignore_for_file: type=lint, unused_element, camel_case_types, non_constant_identifier_names, unused_field
comments:
  style: any
  length: full
