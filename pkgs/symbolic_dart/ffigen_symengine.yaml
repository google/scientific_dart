name: SymEngineBindings
description: Automatically generated type-safe FFI bindings for SymEngine C wrapper API.
output: lib/src/ffi/symengine_bindings.dart
ffi-native:
  asset-id: 'package:symbolic_dart/symengine'
headers:
  entry-points:
    - hook/include/symengine/cwrapper.h
compiler-opts:
  - '-Ihook/include'
preamble: |
  // Automatically generated by ffigen. DO NOT EDIT.
  // ignore_for_file: type=lint, unused_element, unused_field, camel_case_types, non_constant_identifier_names
comments:
  style: any
  length: full
silence-enum-warning: true
structs:
  include:
    - CDenseMatrix
    - CSparseMatrix
    - CVecBasic
    - CSetBasic
    - CMapBasicBasic
functions:
  include:
    - '.*'

