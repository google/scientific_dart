name: symbolic_dart
description: Symbolic mathematics library for Dart with high-performance native CAS bindings (SymEngine & FLINT).
version: 0.0.1
resolution: workspace
repository: https://github.com/google/scientific_dart/tree/main/pkgs/symbolic_dart

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.2.0
  hooks: ^1.0.3
  code_assets: ^1.0.0
  archive: ^3.6.1
  crypto: ^3.0.7
  meta: ^1.18.2
  ndarray: ^0.3.0
  resource_scope: ^0.1.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
  criterion:
    git: https://github.com/sigurdm/criterion.git
  ffigen: ^20.1.1

hooks:
  user_defines:
    symbolic_dart:
      buildMode: source

