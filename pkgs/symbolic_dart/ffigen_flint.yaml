name: FlintBindings
description: Automatically generated type-safe FFI bindings for FLINT exact polynomial API.
output: lib/src/ffi/flint_bindings.dart
ffi-native:
  asset-id: 'package:symbolic_dart/flint'
headers:
  entry-points:
    - hook/include/flint/fmpz.h
    - hook/include/flint/fmpq.h
    - hook/include/flint/fmpq_poly.h
    - hook/include/flint/fmpq_poly_factor.h
    - hook/include/flint/fmpz_poly.h
    - hook/include/flint/fmpz_poly_factor.h
  include-directives:
    - '**/fmpz.h'
    - '**/fmpq.h'
    - '**/fmpq_poly.h'
    - '**/fmpq_poly_factor.h'
    - '**/fmpz_poly.h'
    - '**/fmpz_poly_factor.h'
compiler-opts:
  - '-Ihook/include'
  - '-I/usr/include/x86_64-linux-gnu'
preamble: |
  // Automatically generated by ffigen. DO NOT EDIT.
  // ignore_for_file: type=lint, unused_element, unused_field, camel_case_types, non_constant_identifier_names
comments:
  style: any
  length: full
silence-enum-warning: true

