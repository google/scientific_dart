<!DOCTYPE html>
<html lang="en">
<head>

  <script type="module">
    import { compileStreaming, compile } from './editor_client.mjs';
    async function initWasm() {
      try {
        const wasmUrl = 'editor_client.wasm?v=' + Date.now();
        let compiledApp;
        try {
          compiledApp = await compileStreaming(fetch(wasmUrl));
        } catch (_) {
          const res = await fetch(wasmUrl);
          compiledApp = await compile(await res.arrayBuffer());
        }
        const instantiatedApp = await compiledApp.instantiate({});
        instantiatedApp.invokeMain();
        console.log('Dart CodeEditor WebAssembly module loaded successfully. DartEditor type:', typeof window.DartEditor);
        const stored = localStorage.getItem('notebook_editor_engine');
        if (stored) {
          currentEditorEngine = stored;
          const select = document.getElementById('editorEngineSelect');
          if (select) select.value = stored;
          if (stored === 'dart_editor' && typeof window.switchEditorEngine === 'function') {
            window.switchEditorEngine('dart_editor');
          }
        }
      } catch (e) {
        console.warn('Wasm initialization error:', e);
      }
    }
    window.__editorClientReadyPromise = initWasm();
  </script>
  <style>

    .toolbar {

  </style>

<body>
  <header>
    <div class="title-area">
      <h1>⚡ Dart NDArray Notebook</h1>
      <div id="statusBadge" class="status-badge">
        <span class="status-dot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </div>
    <div class="toolbar">
      <label for="runtimeModeSelect" style="font-size: 13px; color: #a6adc8; margin-right: 4px;">Runtime:</label>
      <select id="runtimeModeSelect" onchange="switchRuntimeMode(this.value)" style="background: #313244; color: #cdd6f4; border: 1px solid #45475a; padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; margin-right: 8px;">
        <option value="ws">Local Server (VM)</option>
        <option value="wasm">Serverless Wasm (Browser)</option>
      </select>
      <label for="editorEngineSelect" style="font-size: 13px; color: #a6adc8; margin-right: 4px;">Editor Engine:</label>
      <select id="editorEngineSelect" onchange="switchEditorEngine(this.value)" style="background: #313244; color: #cdd6f4; border: 1px solid #45475a; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; margin-right: 12px;">
        <option value="codemirror" selected>CodeMirror 5</option>
        <option value="dart_editor">Dart CodeEditor (Custom / Wasm)</option>
      </select>
      <button onclick="addCell()">+ Code</button>
      <button onclick="addMarkdownCell()">+ Markdown</button>
      <button onclick="runAllCells()" class="primary">▶ Run All</button>
      <button onclick="clearAllOutputs()">Clear Outputs</button>
      <button onclick="toggleVariableInspector()">📊 Inspector</button>
      <button onclick="exportIpynb()" title="Export as Jupyter Notebook (.ipynb)">💾 Export .ipynb</button>
      <button onclick="triggerImportIpynb()" title="Open / Import Jupyter Notebook (.ipynb)">📂 Open .ipynb</button>
      <input type="file" id="ipynbFileInput" accept=".ipynb,application/json" style="display: none;" onchange="handleImportIpynb(event)">
    </div>
  </header>

  <div id="inspectorDrawer" class="inspector-drawer">
    <div class="inspector-header">
      <span class="inspector-title">Kernel Variables & NDArrays</span>
      <button onclick="toggleVariableInspector()" style="padding: 2px 6px;">✕</button>
    </div>
    <div id="inspectorList" class="inspector-list">
      <div style="color: #6c7086; font-size: 0.85rem;">Run a code cell declaring a variable (e.g. var a = NDArray...) to inspect live arrays.</div>
    </div>
  </div>

  <main>
    <div id="notebook" class="notebook-container"></div>
    <div class="add-cell-bar">
      <button onclick="addCell()">+ Add Code Cell</button>
      <button onclick="addMarkdownCell()">+ Add Markdown Cell</button>
    </div>
  </main>

  <script src="wasm_notebook_runtime.js"></script>
  <script>
    (function registerNotebookSyntaxModes() {
      if (typeof CodeMirror === 'undefined') return;

      const controlKeywords = new Set([
        'if', 'else', 'for', 'while', 'do', 'switch', 'case', 'default',
        'break', 'continue', 'return', 'try', 'catch', 'finally', 'throw',
        'rethrow', 'assert', 'yield', 'await', 'async', 'sync', 'when',
        'in', 'is', 'as', 'on', 'import', 'export', 'library', 'part',
        'of', 'show', 'hide', 'deferred'
      ]);

      const declarationKeywords = new Set([
        'var', 'final', 'const', 'late', 'required', 'covariant', 'static',
        'abstract', 'base', 'interface', 'sealed', 'mixin', 'class', 'enum',
        'extension', 'typedef', 'implements', 'extends', 'with', 'operator',
        'get', 'set', 'external', 'factory', 'new', 'augment', 'macro'
      ]);

      const atoms = new Set(['true', 'false', 'null']);
      const languageVars = new Set(['this', 'super', 'self']);

      const builtinTypes = new Set([
        'void', 'dynamic', 'Never', 'Object', 'String', 'int', 'double',
        'num', 'bool', 'List', 'Map', 'Set', 'Iterable', 'Future', 'FutureOr',
        'Stream', 'Record', 'Function', 'Symbol', 'Type', 'BigInt', 'RegExp',
        'DateTime', 'Duration', 'Uri', 'Pattern', 'Match', 'Error', 'Exception',
        'StackTrace', 'Comparable', 'Iterator', 'Runes', 'StringBuffer',
        'StringSink', 'Uint8List', 'Int32List', 'Int64List', 'Float32List',
        'Float64List', 'ByteData', 'ByteBuffer', 'Endian',
        'NDArray', 'DType', 'DTypeTag', 'DTypeSpec', 'Float64', 'Float32',
        'Float16', 'BFloat16', 'Complex128', 'Complex64', 'Int64', 'Int32',
        'Int16', 'Int8', 'Uint64', 'Uint32', 'Uint16', 'Uint8', 'Boolean',
        'Complex', 'Slice', 'NDIter', 'ScratchArena', 'Expr', 'SymbolicMatrix',
        'FlintRationalPoly', 'Markdown', 'Md', 'LaTeX', 'Latex', 'Html',
        'Image', 'Audio', 'Displayable'
      ]);

      const builtinFunctions = new Set([
        'print', 'display', 'prettyFormat', 'identical', 'identityHashCode'
      ]);

      function readBlockComment(stream, state, ctx) {
        while (!stream.eol()) {
          if (stream.match('/*')) {
            ctx.depth++;
          } else if (stream.match('*/')) {
            ctx.depth--;
            if (ctx.depth <= 0) {
              state.stack.pop();
              break;
            }
          } else {
            stream.next();
          }
        }
        return 'comment';
      }

      function readString(stream, state, ctx) {
        if (stream.match(ctx.quote)) {
          state.stack.pop();
          return 'string';
        }
        if (!ctx.raw) {
          if (stream.match(/^\\(?:u\{[0-9a-fA-F]+\}|u[0-9a-fA-F]{4}|x[0-9a-fA-F]{2}|.)/)) {
            return 'string-2';
          }
          if (stream.match('${')) {
            state.stack.push({ type: 'interp', braceDepth: 1 });
            state.afterDot = false;
            return 'interpolation';
          }
          if (stream.match(/^\$[a-zA-Z_]\w*/)) {
            return 'variable-2';
          }
        }
        stream.next();
        while (!stream.eol()) {
          if (stream.match(ctx.quote, false)) break;
          if (!ctx.raw) {
            const ch = stream.peek();
            if (ch === '\\' || ch === '$') break;
          }
          stream.next();
        }
        return 'string';
      }

      CodeMirror.defineMode('dart', function() {
        return {
          startState: function() {
            return {
              stack: [],
              afterDot: false,
              inDocComment: false
            };
          },
          copyState: function(state) {
            return {
              stack: state.stack.map(item => Object.assign({}, item)),
              afterDot: state.afterDot,
              inDocComment: state.inDocComment
            };
          },
          token: function(stream, state) {
            if (stream.sol()) {
              state.inDocComment = false;
              while (state.stack.length > 0 && state.stack[state.stack.length - 1].singleLine) {
                state.stack.pop();
              }
            }

            if (state.inDocComment) {
              if (stream.match(/^\[[^\]]+\]/)) return 'comment doc-ref';
              if (stream.match(/^`[^`]+`/)) return 'comment doc-code';
              stream.next();
              while (!stream.eol() && stream.peek() !== '[' && stream.peek() !== '`') {
                stream.next();
              }
              return 'comment doc';
            }

            const top = state.stack.length > 0 ? state.stack[state.stack.length - 1] : null;
            if (top && top.type === 'blockComment') {
              return readBlockComment(stream, state, top);
            }
            if (top && top.type === 'string') {
              return readString(stream, state, top);
            }

            if (stream.eatSpace()) return null;

            // Comments
            if (stream.match('///')) {
              state.inDocComment = true;
              state.afterDot = false;
              return 'comment doc';
            }
            if (stream.match('//')) {
              stream.skipToEnd();
              state.afterDot = false;
              return 'comment';
            }
            if (stream.match('/*')) {
              const ctx = { type: 'blockComment', depth: 1 };
              state.stack.push(ctx);
              state.afterDot = false;
              return readBlockComment(stream, state, ctx);
            }

            // Annotations (@override, @pragma, etc.)
            if (stream.match(/^@[a-zA-Z_]\w*(?:\.[a-zA-Z_]\w*)?/)) {
              state.afterDot = false;
              return 'meta';
            }

            // Strings (raw and standard, triple and single)
            if (stream.match('r"""') || stream.match("r'''")) {
              const q = stream.current().slice(1);
              state.stack.push({ type: 'string', quote: q, raw: true, singleLine: false });
              state.afterDot = false;
              return 'string';
            }
            if (stream.match('"""') || stream.match("'''")) {
              const q = stream.current();
              state.stack.push({ type: 'string', quote: q, raw: false, singleLine: false });
              state.afterDot = false;
              return 'string';
            }
            if (stream.match('r"') || stream.match("r'")) {
              const q = stream.current().slice(1);
              state.stack.push({ type: 'string', quote: q, raw: true, singleLine: true });
              state.afterDot = false;
              return 'string';
            }
            if (stream.match('"') || stream.match("'")) {
              const q = stream.current();
              state.stack.push({ type: 'string', quote: q, raw: false, singleLine: true });
              state.afterDot = false;
              return 'string';
            }

            // Numbers (hex, float, scientific, integer with _ separators)
            if (stream.match(/^0[xX][0-9a-fA-F_]+/) ||
                stream.match(/^\d[\d_]*\.[\d_]+(?:[eE][+-]?[\d_]+)?/) ||
                stream.match(/^\.\d[\d_]*(?:[eE][+-]?[\d_]+)?/) ||
                stream.match(/^\d[\d_]*[eE][+-]?[\d_]+/) ||
                stream.match(/^\d[\d_]*/)) {
              state.afterDot = false;
              return 'number';
            }

            // Member access dots
            if (stream.match(/^(?:\?\.\.|\.\.|\?\.|\.)/)) {
              state.afterDot = true;
              return 'punctuation';
            }

            // Interpolation braces
            if (top && top.type === 'interp') {
              if (stream.eat('{')) {
                top.braceDepth++;
                state.afterDot = false;
                return 'punctuation';
              }
              if (stream.eat('}')) {
                top.braceDepth--;
                state.afterDot = false;
                if (top.braceDepth <= 0) {
                  state.stack.pop();
                  return 'interpolation';
                }
                return 'punctuation';
              }
            }

            // Identifiers, keywords, types, functions, properties, named args
            if (stream.match(/^[a-zA-Z_$][a-zA-Z0-9_$]*/)) {
              const word = stream.current();
              const rest = stream.string.slice(stream.pos);
              const wasAfterDot = state.afterDot;
              state.afterDot = false;

              const isCall = /^\s*(?:<[^>()\n]+>\s*)?\(/.test(rest);
              const isNamedArg = !wasAfterDot && /^\s*:(?![=:])/.test(rest);

              if (wasAfterDot) {
                if (isCall) return 'callee';
                if (/^[A-Z]/.test(word)) return 'type';
                return 'property';
              }

              if (isNamedArg && word !== 'case' && word !== 'default') {
                return 'attribute';
              }

              if (controlKeywords.has(word)) return 'keyword';
              if (declarationKeywords.has(word)) return 'def-keyword';
              if (atoms.has(word)) return 'atom';
              if (languageVars.has(word)) return 'variable-language';
              if (builtinTypes.has(word)) return 'type';
              if (builtinFunctions.has(word)) return 'callee';

              if (/^[A-Z]/.test(word)) return 'type';
              if (isCall) return 'callee';
              return 'variable';
            }

            // Operators
            if (stream.match(/^(?:>>>=|<<=|>>=|\?\?=|\+=|-=|\*=|\/=|~\/=|%=|&=|\^=|\|=|==|!=|<=|>=|&&|\|\||\?\?|<<|>>>|>>|~\/|=>|[+\-*\/%~<>=!&|^?])/)) {
              state.afterDot = false;
              return 'operator';
            }

            // Punctuation
            if (stream.match(/^[()[\]{},;:]/)) {
              state.afterDot = false;
              return 'punctuation';
            }

            stream.next();
            state.afterDot = false;
            return null;
          },
          lineComment: '//',
          blockCommentStart: '/*',
          blockCommentEnd: '*/'
        };
      });

      CodeMirror.defineMIME('application/dart', 'dart');
      CodeMirror.defineMIME('text/x-dart', 'dart');
      CodeMirror.defineMIME('application/x-dart', 'dart');

      // Rich Markdown mode with fenced Dart code blocks & LaTeX math support
      CodeMirror.defineMode('notebook-markdown', function(config) {
        const dartMode = CodeMirror.getMode(config, 'dart');
        return {
          startState: function() {
            return {
              inCodeFence: false,
              codeLang: '',
              dartState: dartMode.startState(),
              inMathBlock: false
            };
          },
          copyState: function(state) {
            return {
              inCodeFence: state.inCodeFence,
              codeLang: state.codeLang,
              dartState: CodeMirror.copyState(dartMode, state.dartState),
              inMathBlock: state.inMathBlock
            };
          },
          token: function(stream, state) {
            if (stream.sol()) {
              if (stream.match(/^\s*```([\w+-]*).*$/)) {
                if (!state.inCodeFence) {
                  state.inCodeFence = true;
                  state.codeLang = (stream.current().replace(/^\s*```/, '').trim() || 'dart').toLowerCase();
                  state.dartState = dartMode.startState();
                } else {
                  state.inCodeFence = false;
                  state.codeLang = '';
                }
                return 'meta';
              }
            }

            if (state.inCodeFence) {
              if (state.codeLang === 'dart' || state.codeLang === '') {
                return dartMode.token(stream, state.dartState);
              }
              stream.skipToEnd();
              return 'string';
            }

            if (state.inMathBlock) {
              if (stream.match('$$')) {
                state.inMathBlock = false;
                return 'math';
              }
              stream.next();
              while (!stream.eol() && !stream.match('$$', false)) {
                stream.next();
              }
              return 'math';
            }

            if (stream.sol()) {
              if (stream.match(/^#{1,6}\s+.*$/)) return 'header';
              if (stream.match(/^\s*>\s+.*$/)) return 'quote';
              if (stream.match(/^\s*(?:[-*+]|\d+\.)\s+/)) return 'keyword';
            }

            if (stream.match('$$')) {
              state.inMathBlock = true;
              return 'math';
            }
            if (stream.match(/^\$[^\$\n]+\$/)) return 'math';
            if (stream.match(/^`[^`\n]+`/)) return 'inline-code';
            if (stream.match(/^\*\*[^*\n]+\*\*/)) return 'strong';
            if (stream.match(/^\*[^*\n]+\*/)) return 'em';
            if (stream.match(/^\[[^\]]+\]\([^)]+\)/)) return 'link';

            stream.next();
            while (!stream.eol()) {
              const ch = stream.peek();
              if (ch === '$' || ch === '`' || ch === '*' || ch === '[') break;
              stream.next();
            }
            return null;
          }
        };
      });
    })();

    function escapeHtmlText(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function highlightDartCodeToHtml(code) {
      if (typeof CodeMirror === 'undefined' || typeof CodeMirror.getMode !== 'function') {
        return escapeHtmlText(code);
      }
      const mode = CodeMirror.getMode({}, 'dart');
      if (!mode || typeof mode.token !== 'function') {
        return escapeHtmlText(code);
      }
      const state = mode.startState();
      const lines = code.split('\n');
      const outLines = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const stream = new CodeMirror.StringStream(line);
        let lineHtml = '';
        while (!stream.eol()) {
          const style = mode.token(stream, state);
          const text = escapeHtmlText(stream.current());
          if (style) {
            const classes = style
              .split(/\s+/)
              .filter(Boolean)
              .map(c => `cm-${c}`)
              .join(' ');
            lineHtml += `<span class="${classes}">${text}</span>`;
          } else {
            lineHtml += text;
          }
          stream.start = stream.pos;
        }
        outLines.push(lineHtml);
      }
      return outLines.join('\n');
    }

    function highlightCodeBlocksIn(container) {
      if (!container) return;
      const blocks = container.querySelectorAll('pre code');
      blocks.forEach(block => {
        if (block.dataset.highlighted === 'true') return;
        const langClass = Array.from(block.classList).find(c => c.startsWith('language-'));
        const lang = langClass ? langClass.slice('language-'.length).toLowerCase() : 'dart';
        if (lang === 'dart' || lang === '') {
          const rawCode = block.textContent || '';
          block.classList.add('cm-highlighted-code');
          block.innerHTML = highlightDartCodeToHtml(rawCode);
          block.dataset.highlighted = 'true';
        }
      });
    }

    let ws;
    let wasmRuntime = null;
    let wsEverConnected = false;
    const urlParams = new URLSearchParams(window.location.search);
    const requestedMode = urlParams.get('mode');
    let currentRuntimeMode =
      requestedMode === 'wasm' || window.NOTEBOOK_SERVERLESS_DEFAULT === true
        ? 'wasm'
        : 'ws';
    let cellCount = 0;
    const pendingEvaluations = new Map();
    const pendingCompletions = new Map();
    const pendingHovers = new Map();
    let activePopup = null;
    let activeHoverPopup = null;
    let hoverTimeout = null;
    let selectedIndex = 0;

    let isInitializingSession = false;

    function populateDefaultStarterCellsIfEmpty() {
      if (document.querySelectorAll('.cell').length === 0) {
        addCellWithState("# Dart NDArray & Symbolic Notebook\nInteractive scientific computing in Dart with native acceleration.", "", false, false, null, 'markdown');
        addCell("// Welcome to Dart NDArray Notebook!\n// Type 'Ctrl+Space' or '.' to test autocompletion.\nvar a = NDArray.fromList([1.0, 2.0, 3.0, 4.0], [2, 2], DType.float64)");
        addCell("// Multiply by scalar or matrix:\na * 2");
      }
    }

    function collectNotebookCells() {
      const cellsData = [];
      document.querySelectorAll('.cell').forEach(cell => {
        const code = cell._cm ? cell._cm.getValue() : (cell.querySelector('textarea') ? cell.querySelector('textarea').value : '');
        const output = cell.querySelector('.output-container');
        const type = cell.getAttribute('data-cell-type') || 'code';
        cellsData.push({
          id: cell.id,
          type: type,
          code: code,
          output: output ? output.innerText : '',
          outputs: cell._outputsList || [],
          isError: output ? output.classList.contains('error') : false,
          evaluated: cell.classList.contains('evaluated')
        });
      });
      return cellsData;
    }

    function initWasmMode() {
      currentRuntimeMode = 'wasm';
      const runtimeSelect = document.getElementById('runtimeModeSelect');
      if (runtimeSelect) runtimeSelect.value = 'wasm';
      if (ws) {
        try {
          ws.onclose = null;
          ws.close();
        } catch (_) {}
        ws = null;
      }
      if (!wasmRuntime && typeof window.WasmNotebookRuntime === 'function') {
        wasmRuntime = new window.WasmNotebookRuntime({
          onStatusChange: (state, text) => updateStatus(state, text)
        });
        window.wasmRuntime = wasmRuntime;
      }
      if (document.querySelectorAll('.cell').length === 0) {
        isInitializingSession = true;
        try {
          const saved = wasmRuntime ? wasmRuntime.loadSessionFromLocalStorage() : null;
          if (saved && saved.length > 0) {
            saved.forEach(c => {
              addCellWithState(c.code, c.output, c.isError, c.evaluated, c.id, c.type || 'code', c.outputs);
            });
          } else {
            populateDefaultStarterCellsIfEmpty();
          }
        } finally {
          isInitializingSession = false;
        }
      }
      if (wasmRuntime) {
        wasmRuntime.init().catch(err => {
          console.error('Wasm runtime init failed:', err);
        });
      }
    }

    function switchRuntimeMode(mode) {
      if (mode === 'wasm') {
        initWasmMode();
      } else {
        currentRuntimeMode = 'ws';
        const runtimeSelect = document.getElementById('runtimeModeSelect');
        if (runtimeSelect) runtimeSelect.value = 'ws';
        initWebSocket();
      }
    }

    function initWebSocket() {
      if (currentRuntimeMode === 'wasm') {
        initWasmMode();
        return;
      }
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        wsEverConnected = true;
        updateStatus('connected', 'Kernel Ready');
      };

      ws.onclose = () => {
        if (currentRuntimeMode === 'wasm') return;
        if (!wsEverConnected && requestedMode !== 'ws' && typeof window.WasmNotebookRuntime === 'function') {
          // Static server with no /ws endpoint -> automatically switch to Serverless Wasm mode.
          initWasmMode();
          return;
        }
        updateStatus('disconnected', 'Disconnected (Reconnecting...)');
        setTimeout(initWebSocket, 2000);
      };

      ws.onerror = (err) => {
        console.error('WebSocket error:', err);
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'result') {
          if (msg.variables) {
            renderVariableInspector(msg.variables);
          }
          const callback = pendingEvaluations.get(msg.id);
          if (callback) {
            callback(msg.output, msg.isError, msg.outputs, msg.formattedCode);
            pendingEvaluations.delete(msg.id);
          }
          if (pendingEvaluations.size === 0) {
            updateStatus('connected', 'Kernel Ready');
          }
        } else if (msg.type === 'variables_update') {
          renderVariableInspector(msg.variables);
        } else if (msg.type === 'format_result') {
          const cell = document.getElementById(msg.cellId);
          if (cell && cell._cm && msg.formattedCode && cell._cm.getValue() !== msg.formattedCode) {
            const cursor = cell._cm.getCursor ? cell._cm.getCursor() : null;
            cell._cm.setValue(msg.formattedCode);
            if (cursor && cell._cm.setCursor) cell._cm.setCursor(cursor);
          }
        } else if (msg.type === 'completion') {
          const callback = pendingCompletions.get(msg.id);
          if (callback) {
            callback(msg.completions);
            pendingCompletions.delete(msg.id);
          }
        } else if (msg.type === 'init_session') {
          isInitializingSession = true;
          try {
            if (msg.cells && msg.cells.length > 0) {
              const notebook = document.getElementById('notebook');
              notebook.innerHTML = '';
              cellCount = 0;
              msg.cells.forEach(c => {
                addCellWithState(c.code, c.output, c.isError, c.evaluated, c.id, c.type || 'code', c.outputs);
              });
            } else {
              populateDefaultStarterCellsIfEmpty();
            }
          } finally {
            isInitializingSession = false;
          }
        } else if (msg.type === 'hover') {
          const callback = pendingHovers.get(msg.id);
          if (callback) {
            callback(msg.hover, msg.hoverHtml);
            pendingHovers.delete(msg.id);
          }
        }
      };
    }

    function autoSaveSession() {
      if (isInitializingSession) return;
      const cellsData = collectNotebookCells();
      if (currentRuntimeMode === 'wasm') {
        if (wasmRuntime) {
          wasmRuntime.saveSessionToLocalStorage(cellsData);
        }
        return;
      }
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        type: 'save_session',
        cells: cellsData
      }));
    }

    function updateStatus(state, text) {
      const badge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      badge.className = `status-badge ${state}`;
      statusText.innerText = text;
    }

    function closeCompletionPopup() {
      if (activePopup) {
        activePopup.remove();
        activePopup = null;
      }
    }

    let hoverHideTimeout = null;

    function closeHoverPopup() {
      clearTimeout(hoverHideTimeout);
      if (activeHoverPopup) {
        activeHoverPopup.remove();
        activeHoverPopup = null;
      }
    }

    function scheduleCloseHoverPopup(delayMs = 350) {
      clearTimeout(hoverHideTimeout);
      hoverHideTimeout = setTimeout(() => {
        closeHoverPopup();
      }, delayMs);
    }

    function requestCompletionCm(cm, cellId) {
      const code = cm.getValue();
      const cursor = cm.getCursor();
      const offset = cm.indexFromPos(cursor);
      if (currentRuntimeMode === 'wasm' && wasmRuntime) {
        wasmRuntime.getCompletions(collectNotebookCells(), cellId, code, offset).then((completions) => {
          showCompletionPopupCm(cm, completions);
        });
        return;
      }
      const reqId = `comp-${Date.now()}`;

      pendingCompletions.set(reqId, (completions) => {
        showCompletionPopupCm(cm, completions);
      });

      ws.send(JSON.stringify({
        type: 'complete',
        id: reqId,
        code: code,
        offset: offset
      }));
    }

    function showCompletionPopupCm(cm, items) {
      closeCompletionPopup();
      if (!items || items.length === 0) return;

      selectedIndex = 0;
      const popup = document.createElement('div');
      popup.className = 'autocomplete-popup';

      const coords = cm.cursorCoords(true, 'page');
      popup.style.top = `${coords.bottom + 4}px`;
      popup.style.left = `${coords.left}px`;

      items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `completion-item ${index === 0 ? 'selected' : ''}`;
        div.innerHTML = `
          <span class="completion-label">${item.label}</span>
          <span class="completion-type">${item.type}</span>
        `;
        div.addEventListener('click', () => {
          applyCompletionCm(cm, item.label);
        });
        popup.appendChild(div);
      });

      document.body.appendChild(popup);
      activePopup = popup;
      activePopup._items = items;
      activePopup._cm = cm;
    }

    function applyCompletionCm(cm, label) {
      const cursor = cm.getCursor();
      const line = cm.getLine(cursor.line);
      let start = cursor.ch - 1;
      while (start >= 0 && /[\w\d_$]/.test(line[start])) {
        start--;
      }
      start++;

      cm.replaceRange(label, { line: cursor.line, ch: start }, { line: cursor.line, ch: cursor.ch });
      closeCompletionPopup();
      cm.focus();
    }

    function requestHoverCm(cm, cellId, offset, x, y) {
      const code = cm.getValue();
      if (currentRuntimeMode === 'wasm' && wasmRuntime) {
        wasmRuntime.getHover(code, offset).then(({ hover, hoverHtml }) => {
          if (hoverHtml || hover) {
            showHoverPopup(x + 12, y + 16, hover, hoverHtml);
          } else {
            scheduleCloseHoverPopup(300);
          }
        });
        return;
      }
      const reqId = `hover-${Date.now()}`;

      pendingHovers.set(reqId, (hoverText, hoverHtml) => {
        if (hoverHtml || hoverText) {
          showHoverPopup(x + 12, y + 16, hoverText, hoverHtml);
        } else {
          scheduleCloseHoverPopup(300);
        }
      });

      ws.send(JSON.stringify({
        type: 'hover',
        id: reqId,
        code: code,
        offset: offset
      }));
    }

    function showHoverPopup(x, y, text, html) {
      clearTimeout(hoverHideTimeout);
      closeHoverPopup();
      if ((!text || !text.trim()) && (!html || !html.trim())) return;

      const popup = document.createElement('div');
      popup.className = 'hover-popup';
      popup.style.top = `${y}px`;
      popup.style.left = `${x}px`;

      if (html) {
        popup.innerHTML = html;
      } else {
        popup.innerText = text;
      }

      highlightCodeBlocksIn(popup);
      tryRenderKaTeX(popup);

      popup.addEventListener('mouseenter', () => {
        clearTimeout(hoverHideTimeout);
      });

      popup.addEventListener('mouseleave', () => {
        scheduleCloseHoverPopup(300);
      });

      document.body.appendChild(popup);
      activeHoverPopup = popup;
    }

    const pendingKaTeXElements = [];
    window.addEventListener('load', () => {
      while (pendingKaTeXElements.length > 0) {
        tryRenderKaTeX(pendingKaTeXElements.shift());
      }
    });

    function tryRenderKaTeX(element) {
      if (window.renderMathInElement) {
        try {
          renderMathInElement(element, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '\\[', right: '\\]', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX render warning:', e);
        }
      } else if (element) {
        pendingKaTeXElements.push(element);
      }
    }

    function renderOutputElement(outputElement, text, isError, outputsArray) {
      outputElement.className = `output-container ${isError ? 'error' : 'success'}`;
      outputElement.innerHTML = '';

      if (isError) {
        outputElement.innerText = text || 'Error';
        return;
      }

      let items = outputsArray;
      if (!items || items.length === 0) {
        if (text && typeof text === 'string' && text.startsWith('[')) {
          try {
            items = JSON.parse(text);
          } catch (_) {}
        }
      }

      if (items && Array.isArray(items) && items.length > 0) {
        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          const mime = item.mimeType || 'text/plain';
          const payload = item.data;

          if (i > 0) {
            const spacer = document.createElement('div');
            spacer.style.height = '12px';
            outputElement.appendChild(spacer);
          }

          if (mime === 'text/html') {
            const wrapper = document.createElement('div');
            wrapper.className = 'output-html-wrapper';
            wrapper.innerHTML = payload;
            highlightCodeBlocksIn(wrapper);
            tryRenderKaTeX(wrapper);
            outputElement.appendChild(wrapper);
            const scripts = Array.from(wrapper.getElementsByTagName('script'));
            for (const s of scripts) {
              const code = s.innerText || s.textContent;
              if (code) {
                try {
                  new Function(code)();
                } catch (e) {
                  console.warn('Script execution error:', e);
                }
              }
            }
          } else {
            const wrapper = document.createElement('div');
            wrapper.className = 'output-plain-text';
            wrapper.innerText = payload;
            outputElement.appendChild(wrapper);
          }
        }
        return;
      }

      if (!text) {
        outputElement.innerText = '(No output)';
        return;
      }

      let cleaned = text.trim();
      while ((cleaned.startsWith('"') || cleaned.startsWith("'")) && cleaned.length > 1) {
        cleaned = cleaned.substring(1).trim();
      }
      while ((cleaned.endsWith('"') || cleaned.endsWith("'")) && cleaned.length > 1) {
        cleaned = cleaned.substring(0, cleaned.length - 1).trim();
      }
      cleaned = cleaned.replace(/\\n/g, '\n').replace(/\\"/g, '"').replace(/\\'/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>');

      if (cleaned.includes('<') && cleaned.includes('>')) {
        const wrapper = document.createElement('div');
        wrapper.className = 'output-html-wrapper';
        wrapper.innerHTML = cleaned;
        highlightCodeBlocksIn(wrapper);
        tryRenderKaTeX(wrapper);
        outputElement.appendChild(wrapper);
        const scripts = Array.from(wrapper.getElementsByTagName('script'));
        for (const s of scripts) {
          const code = s.innerText || s.textContent;
          if (code) {
            try {
              new Function(code)();
            } catch (e) {
              console.warn('Script execution error:', e);
            }
          }
        }
        return;
      }

      outputElement.innerText = text;
    }

    function addCellWithState(initialCode = '', outputText = '', isError = false, evaluated = false, existingId = null, cellType = 'code', outputsArray = null) {
      const cellId = cellType === 'markdown' ? addMarkdownCell(initialCode, existingId) : addCell(initialCode, existingId);
      const cell = document.getElementById(cellId);
      if (cell && outputsArray && outputsArray.length > 0) {
        cell._outputsList = outputsArray;
      }
      if (cellType === 'markdown') {
        if (initialCode) {
          renderMarkdownCell(cellId);
        }
      } else {
        if (outputText || (outputsArray && outputsArray.length > 0)) {
          const output = document.getElementById(`output-${cellId}`);
          renderOutputElement(output, outputText, isError, outputsArray);
        }
        if (evaluated) {
          if (cell) cell.classList.add('evaluated');
        }
      }
      return cellId;
    }

    function addMarkdownCell(initialText = '', existingId = null) {
      cellCount++;
      const cellId = existingId || `cell-${Date.now()}-${cellCount}`;
      const notebook = document.getElementById('notebook');

      const cell = document.createElement('div');
      cell.className = 'cell markdown-cell';
      cell.id = cellId;
      cell.setAttribute('data-cell-type', 'markdown');

      cell.innerHTML = `
        <div class="cell-header">
          <span class="cell-number">[ M ]</span>
          <span class="cell-engine-badge md" style="color: #a6e3a1; border-color: rgba(166, 227, 161, 0.3);">Markdown</span>
          <div class="cell-actions">
            <button onclick="runCell('${cellId}')" title="Render Markdown (Shift+Enter)">▶ Render</button>
            <button onclick="editMarkdownCell('${cellId}')" title="Edit Markdown">✏️ Edit</button>
            <button onclick="deleteCell('${cellId}')" title="Delete Cell">🗑</button>
          </div>
        </div>
        <div class="code-container">
          <textarea class="code-editor" id="editor-${cellId}" placeholder="Enter Markdown text or LaTeX math (e.g. \$\$E = mc^2\$\$)...">${initialText}</textarea>
        </div>
        <div class="markdown-rendered-view" id="rendered-${cellId}" onclick="editMarkdownCell('${cellId}')" title="Click to edit markdown"></div>
        <div class="output-container empty" id="output-${cellId}"></div>
      `;

      notebook.appendChild(cell);

      const textarea = document.getElementById(`editor-${cellId}`);
      setupEditorForCell(cell, textarea, cellId, initialText);

      if (initialText && initialText.trim().length > 0) {
        renderMarkdownCell(cellId);
      }
      return cellId;
    }

    function renderMarkdownCell(cellId) {
      const cell = document.getElementById(cellId);
      if (!cell) return;
      const text = cell._cm ? cell._cm.getValue() : (document.getElementById(`editor-${cellId}`)?.value || '');
      const renderedView = document.getElementById(`rendered-${cellId}`);
      if (renderedView) {
        if (window.marked && typeof window.marked.parse === 'function') {
          const mathBlocks = [];
          const protectedText = text
            .replace(/\$\$[\s\S]+?\$\$/g, (m) => {
              mathBlocks.push(m);
              return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
            })
            .replace(/\$(?!\$)([^\$\n]+?)\$/g, (m) => {
              mathBlocks.push(m);
              return `@@MATH_BLOCK_${mathBlocks.length - 1}@@`;
            });
          let html = marked.parse(protectedText);
          html = html.replace(/@@MATH_BLOCK_(\d+)@@/g, (_, idx) => mathBlocks[Number(idx)]);
          renderedView.innerHTML = html;
        } else {
          renderedView.innerText = text;
        }
        highlightCodeBlocksIn(renderedView);
        tryRenderKaTeX(renderedView);
      }
      cell.classList.add('rendered');
      autoSaveSession();
    }

    function editMarkdownCell(cellId) {
      const cell = document.getElementById(cellId);
      if (!cell) return;
      cell.classList.remove('rendered');
      if (cell._cm && cell._cm.focus) {
        cell._cm.focus();
      }
    }

    function addCell(initialCode = '', existingId = null) {
      cellCount++;
      const cellId = existingId || `cell-${Date.now()}-${cellCount}`;
      const notebook = document.getElementById('notebook');

      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = cellId;
      cell.setAttribute('data-cell-type', 'code');

      cell.innerHTML = `
        <div class="cell-header">
          <span class="cell-number">[ ${cellCount} ]</span>
          <span class="cell-engine-badge cm" id="engine-badge-${cellId}">CM 5</span>
          <div class="cell-actions">
            <button onclick="runCell('${cellId}')" title="Run (Shift+Enter)">▶ Run</button>
            <button onclick="formatCell('${cellId}')" title="Format Code (Shift+Alt+F)">✨ Format</button>
            <button onclick="runUntilCell('${cellId}')" title="Run all cells up to and including this one">▶▶ Until Here</button>
            <button onclick="deleteCell('${cellId}')" title="Delete Cell">🗑</button>
          </div>
        </div>
        <div class="code-container">
          <textarea class="code-editor" id="editor-${cellId}" placeholder="Enter Dart code or expression... (Ctrl+Space for autocompletion)">${initialCode}</textarea>
        </div>
        <div class="output-container empty" id="output-${cellId}"></div>
      `;

      notebook.appendChild(cell);

      const textarea = document.getElementById(`editor-${cellId}`);
      setupEditorForCell(cell, textarea, cellId, initialCode);
      return cellId;
    }

    function exportIpynb() {
      if (currentRuntimeMode === 'wasm' && wasmRuntime) {
        return wasmRuntime.exportIpynbClientSide(collectNotebookCells());
      }
      window.location.href = '/api/export/ipynb';
    }

    function importIpynbContentClientSide(content) {
      if (!wasmRuntime) return;
      const cells = wasmRuntime.parseIpynbJsonToSessionCells(content);
      const notebook = document.getElementById('notebook');
      notebook.innerHTML = '';
      cellCount = 0;
      cells.forEach(c => {
        addCellWithState(c.code, c.output, c.isError, c.evaluated, c.id, c.type || 'code', c.outputs);
      });
      autoSaveSession();
    }

    function triggerImportIpynb() {
      const fileInput = document.getElementById('ipynbFileInput');
      if (fileInput) {
        fileInput.value = '';
        fileInput.click();
      }
    }

    function handleImportIpynb(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        const content = e.target.result;
        try {
          JSON.parse(content); // validate JSON
          if (currentRuntimeMode === 'wasm' && wasmRuntime) {
            importIpynbContentClientSide(content);
            return;
          }
          const res = await fetch('/api/import/ipynb', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-ipynb+json' },
            body: content
          });
          if (!res.ok) {
            const err = await res.text();
            alert('Failed to import notebook: ' + err);
          }
        } catch (err) {
          alert('Invalid .ipynb notebook file: ' + err);
        }
      };
      reader.readAsText(file);
    }

    let currentEditorEngine = localStorage.getItem('notebook_editor_engine') || 'codemirror';

    function switchEditorEngine(engine) {
      currentEditorEngine = engine;
      localStorage.setItem('notebook_editor_engine', engine);

      document.querySelectorAll('.cell').forEach(cell => {
        if (cell.getAttribute('data-cell-type') === 'markdown') return;
        const code = cell._cm ? cell._cm.getValue() : (document.getElementById(`editor-${cell.id}`)?.value || '');
        const container = cell.querySelector('.code-container');
        if (container) {
          container.innerHTML = `<textarea class="code-editor" id="editor-${cell.id}" placeholder="Enter Dart code or expression... (Ctrl+Space for autocompletion)">${code}</textarea>`;
          const textarea = document.getElementById(`editor-${cell.id}`);
          setupEditorForCell(cell, textarea, cell.id, code);
        }
      });
    }

    function setupEditorForCell(cell, textarea, cellId, initialCode) {
      let cm = null;
      const isMarkdown = cell.getAttribute('data-cell-type') === 'markdown';
      const badge = cell.querySelector('.cell-engine-badge') || document.getElementById(`engine-badge-${cellId}`);

      if (!isMarkdown && currentEditorEngine === 'dart_editor' && typeof window.DartEditor === 'function') {
        try {
          cm = window.DartEditor(textarea);
          if (badge) {
            badge.className = 'cell-engine-badge wasm';
            badge.innerText = '⚡ Custom Wasm';
            badge.title = 'Using Custom Dart CodeEditor (WebAssembly)';
          }
        } catch (e) {
          console.warn('DartEditor initialization warning:', e);
        }
      }

      if (!cm || typeof cm.getValue !== 'function') {
        if (badge && !isMarkdown) {
          badge.className = 'cell-engine-badge cm';
          badge.innerText = 'CM 5';
          badge.title = 'Using CodeMirror 5';
        }
        cm = CodeMirror.fromTextArea(textarea, {
          mode: isMarkdown ? 'notebook-markdown' : 'dart',
          theme: 'dracula',
          lineNumbers: true,
          matchBrackets: !isMarkdown,
          autoCloseBrackets: true,
          viewportMargin: Infinity,
          extraKeys: {
            'Shift-Enter': function(cm) {
              closeCompletionPopup();
              runCell(cellId);
            },
            'Shift-Alt-F': function(cm) {
              if (!isMarkdown) formatCell(cellId);
            },
            'Ctrl-Shift-I': function(cm) {
              if (!isMarkdown) formatCell(cellId);
            },
            'Cmd-Shift-I': function(cm) {
              if (!isMarkdown) formatCell(cellId);
            },
            'Ctrl-Alt-L': function(cm) {
              if (!isMarkdown) formatCell(cellId);
            },
            'Cmd-Option-L': function(cm) {
              if (!isMarkdown) formatCell(cellId);
            },
            'Ctrl-Space': function(cm) {
              if (!isMarkdown) requestCompletionCm(cm, cellId);
            },
            'Cmd-Space': function(cm) {
              if (!isMarkdown) requestCompletionCm(cm, cellId);
            }
          }
        });

        cm.on('change', (instance, changeObj) => {
          cell.classList.remove('evaluated');
          if (changeObj.origin === '+insert' && changeObj.text && changeObj.text.includes('.')) {
            requestCompletionCm(cm, cellId);
          }
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'update_cell', id: cellId, code: cm.getValue() }));
          }
        });

        cm.on('focus', () => {
          document.querySelectorAll('.cell').forEach(c => c.classList.remove('focused'));
          cell.classList.add('focused');
        });

        let hoverTimeout = null;
        if (cm.getWrapperElement) {
          cm.getWrapperElement().addEventListener('mousemove', (e) => {
            if (activeHoverPopup && (activeHoverPopup === e.target || activeHoverPopup.contains(e.target))) {
              clearTimeout(hoverHideTimeout);
              return;
            }
            clearTimeout(hoverTimeout);
            hoverTimeout = setTimeout(() => {
              const pos = cm.coordsChar({ left: e.clientX, top: e.clientY });
              const token = cm.getTokenAt(pos);
              if (token && token.string && token.string.trim().length > 0) {
                const offset = cm.indexFromPos(pos);
                requestHoverCm(cm, cellId, offset, e.clientX, e.clientY);
              } else {
                scheduleCloseHoverPopup(400);
              }
            }, 300);
          });

          cm.getWrapperElement().addEventListener('mouseleave', (e) => {
            clearTimeout(hoverTimeout);
            if (activeHoverPopup && (activeHoverPopup === e.relatedTarget || activeHoverPopup.contains(e.relatedTarget))) {
              clearTimeout(hoverHideTimeout);
              return;
            }
            scheduleCloseHoverPopup(500);
          });
        }
      } else {
        if (!cm.getCursor) cm.getCursor = () => ({ line: 0, ch: 0 });
        if (!cm.setCursor) cm.setCursor = () => {};
        if (!cm.indexFromPos) cm.indexFromPos = () => 0;
        if (!cm.getLine) cm.getLine = () => '';
        if (!cm.replaceRange) cm.replaceRange = () => {};
        if (!cm.focus) cm.focus = () => textarea.focus();
        if (typeof cm.on === 'function') {
          cm.on('change', (instance, changeObj) => {
            cell.classList.remove('evaluated');
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: 'update_cell', id: cellId, code: cm.getValue() }));
            }
          });
        }
      }

      cell._cm = cm;
      if (!initialCode && cm.focus) cm.focus();
    }

    function deleteCell(cellId) {
      const cell = document.getElementById(cellId);
      if (cell) {
        cell.remove();
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'delete_cell', id: cellId }));
        } else {
          autoSaveSession();
        }
      }
    }

    function applyWasmBatchRunResult(res, targetCellId) {
      if (!res.ok) {
        const targetId =
          targetCellId ||
          Array.from(document.querySelectorAll('.cell[data-cell-type="code"]')).pop()?.id;
        if (targetId) {
          const outEl = document.getElementById(`output-${targetId}`);
          const cellEl = document.getElementById(targetId);
          if (outEl) {
            renderOutputElement(outEl, res.error || 'Error', true, []);
          }
          if (
            cellEl &&
            currentEditorEngine === 'dart_editor' &&
            cellEl._cm &&
            typeof cellEl._cm.setDiagnostic === 'function'
          ) {
            let errLine = 0;
            const lineMatch = /:(\d+):\d+:\s*Error:/i.exec(res.error || '');
            if (lineMatch) {
              errLine = Math.max(0, parseInt(lineMatch[1], 10) - 1);
            }
            cellEl._cm.setDiagnostic(errLine, 0, 12, String(res.error || '').substring(0, 120));
          }
        }
        autoSaveSession();
        return;
      }

      if (res.variables) {
        renderVariableInspector(res.variables);
      }

      for (const cr of res.cells || []) {
        const cEl = document.getElementById(cr.cellId);
        const oEl = document.getElementById(`output-${cr.cellId}`);
        if (!cEl || !oEl) continue;
        const shouldRender =
          !targetCellId ||
          cr.cellId === targetCellId ||
          !cEl.classList.contains('evaluated') ||
          cr.isError;
        if (shouldRender) {
          renderOutputElement(oEl, cr.output, cr.isError, cr.outputs);
          if (!cr.isError) {
            cEl.classList.add('evaluated');
          } else {
            cEl.classList.remove('evaluated');
          }
          if (cr.outputs && cr.outputs.length > 0) {
            cEl._outputsList = cr.outputs;
          }
        }
      }
      autoSaveSession();
    }

    function runCell(cellId, onComplete, appendIfLast = true) {
      const cell = document.getElementById(cellId);
      if (!cell) {
        if (onComplete) onComplete();
        return;
      }

      if (cell.getAttribute('data-cell-type') === 'markdown') {
        renderMarkdownCell(cellId);
        if (onComplete) onComplete();
        return;
      }

      const output = document.getElementById(`output-${cellId}`);
      const code = (cell._cm ? cell._cm.getValue() : (document.getElementById(`editor-${cellId}`)?.value || '')).trim();

      if (!code) {
        if (onComplete) onComplete();
        return;
      }

      const allCells = document.querySelectorAll('.cell');
      const isLastCell = appendIfLast && allCells.length > 0 && allCells[allCells.length - 1].id === cellId;

      updateStatus('busy', 'Executing...');
      output.className = 'output-container';
      output.innerText = 'Running...';
      if (cell && cell._cm && typeof cell._cm.clearDiagnostics === 'function') {
        cell._cm.clearDiagnostics();
      }

      if (currentRuntimeMode === 'wasm' && wasmRuntime) {
        if (isLastCell) {
          addCell();
        }
        const snapshotCells = collectNotebookCells();
        wasmRuntime.executeCells(snapshotCells, cellId).then((res) => {
          applyWasmBatchRunResult(res, cellId);
          if (onComplete) onComplete();
        });
        return;
      }

      const reqId = `${cellId}-${Date.now()}`;
      pendingEvaluations.set(reqId, (resultText, isError, outputsArray, formattedCode) => {
        renderOutputElement(output, resultText, isError, outputsArray);
        if (formattedCode && cell && cell._cm && cell._cm.getValue() !== formattedCode) {
          const cursor = cell._cm.getCursor ? cell._cm.getCursor() : null;
          cell._cm.setValue(formattedCode);
          if (cursor && cell._cm.setCursor) cell._cm.setCursor(cursor);
        }
        if (cell && !isError) {
          cell.classList.add('evaluated');
        }
        if (outputsArray && outputsArray.length > 0) {
          cell._outputsList = outputsArray;
        }
        if (cell && isError && currentEditorEngine === 'dart_editor' && cell._cm && typeof cell._cm.setDiagnostic === 'function') {
          let errLine = 0;
          const lineMatch = /line\s+(\d+)/i.exec(resultText);
          if (lineMatch) {
            errLine = Math.max(0, parseInt(lineMatch[1], 10) - 1);
          }
          cell._cm.setDiagnostic(errLine, 0, 12, resultText.substring(0, 120));
        }
        autoSaveSession();
        if (onComplete) onComplete();
      });

      ws.send(JSON.stringify({
        type: 'execute',
        id: reqId,
        cellId: cellId,
        code: code
      }));

      if (isLastCell) {
        addCell();
      }
    }

    async function runUntilCell(targetCellId) {
      const cells = Array.from(document.querySelectorAll('.cell'));
      const targetIndex = cells.findIndex(c => c.id === targetCellId);
      if (targetIndex === -1) return;

      if (currentRuntimeMode === 'wasm' && wasmRuntime) {
        for (let i = 0; i <= targetIndex; i++) {
          if (cells[i].getAttribute('data-cell-type') === 'markdown') {
            renderMarkdownCell(cells[i].id);
          } else {
            const oEl = document.getElementById(`output-${cells[i].id}`);
            if (oEl) {
              oEl.className = 'output-container';
              oEl.innerText = 'Running...';
            }
          }
        }
        const res = await wasmRuntime.executeCells(collectNotebookCells(), targetCellId);
        applyWasmBatchRunResult(res, null);
        return;
      }

      for (let i = 0; i <= targetIndex; i++) {
        const cellId = cells[i].id;
        await new Promise((resolve) => {
          runCell(cellId, resolve, false);
        });
      }
    }

    async function runAllCells() {
      const cells = Array.from(document.querySelectorAll('.cell'));
      if (currentRuntimeMode === 'wasm' && wasmRuntime) {
        for (const c of cells) {
          if (c.getAttribute('data-cell-type') === 'markdown') {
            renderMarkdownCell(c.id);
          } else {
            const code = (c._cm ? c._cm.getValue() : '').trim();
            if (code) {
              const oEl = document.getElementById(`output-${c.id}`);
              if (oEl) {
                oEl.className = 'output-container';
                oEl.innerText = 'Running...';
              }
            }
          }
        }
        const res = await wasmRuntime.executeCells(collectNotebookCells(), null);
        applyWasmBatchRunResult(res, null);
        return;
      }
      for (const cell of cells) {
        await new Promise((resolve) => {
          runCell(cell.id, resolve, false);
        });
      }
    }

    function clearAllOutputs() {
      document.querySelectorAll('.output-container').forEach(out => {
        out.className = 'output-container empty';
        out.innerText = '';
      });
      document.querySelectorAll('.cell').forEach(cell => {
        cell._outputsList = [];
      });
      autoSaveSession();
    }

    function applyFormattedCodeToCell(cell, formattedCode) {
      if (!cell || !cell._cm || !formattedCode) return;
      const currentCode = cell._cm.getValue();
      if (currentCode === formattedCode) return;
      const cursor = cell._cm.getCursor ? cell._cm.getCursor() : null;
      cell._cm.setValue(formattedCode);
      if (cursor && cell._cm.setCursor) cell._cm.setCursor(cursor);
      autoSaveSession();
    }

    function formatCell(cellId) {
      const cell = document.getElementById(cellId);
      if (!cell || !cell._cm) return;
      if (cell.getAttribute('data-cell-type') === 'markdown') return;

      if (typeof cell._cm.formatCode === 'function') {
        cell._cm.formatCode();
        autoSaveSession();
        return;
      }

      const currentCode = cell._cm.getValue();
      if (!currentCode || !currentCode.trim()) return;

      if (typeof window.dartFormatCode === 'function') {
        try {
          const formatted = window.dartFormatCode(currentCode);
          if (typeof formatted === 'string' && formatted.length > 0) {
            applyFormattedCodeToCell(cell, formatted);
            return;
          }
        } catch (err) {
          console.warn('Local Wasm format error:', err);
        }
      }

      if (currentRuntimeMode === 'wasm' && wasmRuntime && typeof wasmRuntime.formatCode === 'function') {
        wasmRuntime.formatCode(currentCode).then((formatted) => {
          applyFormattedCodeToCell(cell, formatted);
        });
        return;
      }

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'format_code',
          cellId: cellId,
          code: currentCode
        }));
      }
    }

    function toggleVariableInspector() {
      const drawer = document.getElementById('inspectorDrawer');
      drawer.classList.toggle('open');
      if (drawer.classList.contains('open')) {
        if (currentRuntimeMode === 'wasm' && wasmRuntime) {
          renderVariableInspector(wasmRuntime.knownVariables);
        } else if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'inspect_variables' }));
        }
      }
    }

    function renderVariableInspector(vars) {
      const list = document.getElementById('inspectorList');
      if (!list) return;
      if (!vars || vars.length === 0) {
        list.innerHTML = '<div style="color: #6c7086; font-size: 0.85rem;">No user variables declared yet. Run a code cell declaring a variable (e.g. var a = NDArray...) to see it here.</div>';
        return;
      }
      list.innerHTML = vars.map(v => `
        <div class="inspector-item">
          <div>
            <span class="inspector-item-name">${v.name}</span>
            <span class="inspector-item-type">[${v.type}]</span>
          </div>
          <div class="inspector-item-summary">${v.summary}</div>
        </div>
      `).join('');
    }

    window.runCell = runCell;
    window.runUntilCell = runUntilCell;
    window.runAllCells = runAllCells;
    window.deleteCell = deleteCell;
    window.switchEditorEngine = switchEditorEngine;
    window.switchRuntimeMode = switchRuntimeMode;
    window.formatCell = formatCell;
    window.toggleVariableInspector = toggleVariableInspector;
    window.addCell = addCell;
    window.addMarkdownCell = addMarkdownCell;
    window.renderMarkdownCell = renderMarkdownCell;
    window.editMarkdownCell = editMarkdownCell;
    window.exportIpynb = exportIpynb;
    window.importIpynbContentClientSide = importIpynbContentClientSide;
    window.collectNotebookCells = collectNotebookCells;
    window.triggerImportIpynb = triggerImportIpynb;
    window.handleImportIpynb = handleImportIpynb;

    // Initialize default starter cells
    window.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('editorEngineSelect');
      if (select) select.value = currentEditorEngine;
      const runtimeSelect = document.getElementById('runtimeModeSelect');
      if (runtimeSelect) runtimeSelect.value = currentRuntimeMode;
      initWebSocket();

      window.addEventListener('scroll', () => {
        closeCompletionPopup();
        closeHoverPopup();
      }, true);

      document.addEventListener('click', (e) => {
        if (activePopup && !activePopup.contains(e.target) && !e.target.classList.contains('code-editor')) {
          closeCompletionPopup();
        }
        if (activeHoverPopup && !activeHoverPopup.contains(e.target) && !e.target.classList.contains('code-editor')) {
          closeHoverPopup();
        }
      });
    });
  </script>
</body>
</html>
