name: ndarray_transformer
description: >-
  Pure-Dart BERT / all-MiniLM-L6-v2 transformer embedding and semantic search
  showcase powered by package:ndarray and Hugging Face .safetensors weights.
version: 0.1.0
publish_to: none
resolution: workspace
repository: https://github.com/google/scientific_dart/tree/main/pkgs/ndarray_transformer

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.7.0
  http: ^1.6.0
  ndarray: ^0.4.0-wip

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
