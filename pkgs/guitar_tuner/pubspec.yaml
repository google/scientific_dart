name: guitar_tuner
description: A CLI guitar tuner using ndarray and ALSA.
version: 0.1.0
publish_to: none
resolution: workspace
repository: https://github.com/google/scientific_dart/tree/main/pkgs/guitar_tuner

environment:
  sdk: ^3.10.0

dependencies:
  ndarray: ^0.1.0
  ffi: ^2.2.0
  args: ^2.7.0
  hooks: ^1.0.3
  code_assets: ^1.0.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
