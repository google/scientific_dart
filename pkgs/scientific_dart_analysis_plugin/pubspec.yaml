name: scientific_dart_analysis_plugin
description: Analyzer plugin providing memory-safety, view-lifecycle, DType, and performance lints for scientific_dart (ndarray, resource_scope, symbolic_dart, etc.) consumers.
version: 0.0.1
resolution: workspace
repository: https://github.com/google/scientific_dart/tree/main/pkgs/scientific_dart_analysis_plugin

environment:
  sdk: ^3.10.0

dependencies:
  analysis_server_plugin: ^0.3.18
  analyzer: ^13.3.0
  analyzer_plugin: ^0.14.12

dev_dependencies:
  lints: ^6.1.0
  ndarray: ^0.2.0
  resource_scope: ^0.1.0
  test: ^1.31.1
